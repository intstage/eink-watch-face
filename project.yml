# Проект Xcode генерируется командой `xcodegen` из этой папки.
# Команда разработчика и префикс bundle id — в Config.xcconfig / Local.xcconfig.
name: EinkFace
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
options:
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES

targets:
  EinkFace:
    type: application
    platform: iOS
    sources: [iOS]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).einkface
        INFOPLIST_KEY_CFBundleDisplayName: E-ink
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: EinkFaceWatch
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch

  EinkFaceWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    scheme: {}
    info:
      path: Watch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_PREFIX).einkface
        NSLocationWhenInUseUsageDescription: Погода для циферблата.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).einkface.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: E-ink
        SKIP_INSTALL: YES
    dependencies:
      - target: EinkFaceWidget
        embed: true

  EinkFaceWidget:
    type: app-extension
    platform: watchOS
    sources: [WatchWidget, Shared]
    info:
      path: WatchWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).einkface.watchkitapp.widget
        INFOPLIST_KEY_CFBundleDisplayName: E-ink
        SKIP_INSTALL: YES
